<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Stoic Reps</title>
<meta name="theme-color" content="#111214">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Stoic Reps">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main id="view"></main>

<nav class="tabs" aria-label="Sections">
  <button data-tab="home" class="on"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 7v10M18 7v10M3 10v4M21 10v4M6 12h12"/></svg>Train</button>
  <button data-tab="progress"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 19V9M10 19V5M16 19v-7M22 19H2"/></svg>Progress</button>
  <button data-tab="more"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="5" cy="12" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="19" cy="12" r="1.5"/></svg>More</button>
</nav>

<!-- log sheet: opens from an exercise button -->
<div id="sheet" class="sheet" hidden>
  <div class="sheet-card" role="dialog" aria-modal="true" aria-labelledby="sh-title">
    <div class="sheet-head"><h2 id="sh-title"></h2><button class="x" data-close aria-label="Close">×</button></div>
    <p id="sh-next" class="next"></p>
    <div class="field"><label>Reps <span id="sh-per"></span></label>
      <div class="stepper"><button data-step="reps:-1" aria-label="Fewer reps">−</button><output id="sh-reps" aria-live="polite"></output><button data-step="reps:1" aria-label="More reps">+</button></div></div>
    <div class="field"><label>Added weight (kg) <span class="hint">0 = bodyweight</span></label>
      <div class="stepper"><button data-step="kg:-2.5" aria-label="Less weight">−</button><output id="sh-kg" aria-live="polite"></output><button data-step="kg:2.5" aria-label="More weight">+</button></div></div>
    <div id="sh-var" class="field" hidden><label>Push-up variation</label><div class="seg" id="sh-var-seg"></div></div>
    <button id="sh-log" class="big primary">Log set</button>
    <div id="sh-today" class="today-sets"></div>
    <div id="sh-quote"></div>
  </div>
</div>

<div id="modal" class="sheet" hidden><div class="sheet-card" id="modal-body" role="dialog" aria-modal="true" aria-label="New record"></div></div>
<div id="rest" class="rest" role="timer" aria-label="Rest timer" hidden><span>Rest</span><b id="rest-t">0:00</b>
  <button data-rest="30" aria-label="Add 30 seconds">+30s</button><button data-rest="0">Skip</button></div>
<div id="suit" class="suit" role="status" hidden></div>
<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

<script src="quotes.js"></script>
<script src="app.js"></script>
</body>
</html>
