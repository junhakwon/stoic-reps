<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Stoic Reps</title>
<meta name="theme-color" content="#111214">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Stoic Reps">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main id="view"></main>

<nav class="tabs">
  <button data-tab="home" class="on">Train</button>
  <button data-tab="progress">Progress</button>
  <button data-tab="more">More</button>
</nav>

<!-- log sheet: opens from an exercise button -->
<div id="sheet" class="sheet" hidden>
  <div class="sheet-card">
    <div class="sheet-head"><h2 id="sh-title"></h2><button class="x" data-close>×</button></div>
    <p id="sh-next" class="next"></p>
    <div class="field"><label>Reps <span id="sh-per"></span></label>
      <div class="stepper"><button data-step="reps:-1">−</button><output id="sh-reps"></output><button data-step="reps:1">+</button></div></div>
    <div class="field"><label>Added weight (kg) <span class="hint">0 = bodyweight</span></label>
      <div class="stepper"><button data-step="kg:-2.5">−</button><output id="sh-kg"></output><button data-step="kg:2.5">+</button></div></div>
    <div id="sh-var" class="field" hidden><label>Push-up variation</label><div class="seg" id="sh-var-seg"></div></div>
    <button id="sh-log" class="big primary">Log set</button>
    <div id="sh-today" class="today-sets"></div>
    <div id="sh-quote"></div>
  </div>
</div>

<div id="modal" class="sheet" hidden><div class="sheet-card" id="modal-body"></div></div>
<div id="toast" class="toast" hidden></div>

<script src="quotes.js"></script>
<script src="app.js"></script>
</body>
</html>
